<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Gandalf 发送图标候选（透明底 · 白色图形）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; background: #141414; font-family: 'Microsoft YaHei', sans-serif; color: #ddd; }
  h1 { font-size: 18px; color: #fff; margin: 0 0 8px; }
  p { color: #999; font-size: 13px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px 12px 12px; text-align: center; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: rgba(255,255,255,0.4); }
  .card .icon { width: 56px; height: 56px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; }
  .card .icon svg { width: 100%; height: 100%; }
  .card .name { font-size: 13px; color: #fff; }
  .card .desc { font-size: 11px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<h1>✦ 发送按钮图标候选（甘道夫 / 中土风）</h1>
<p>透明底 · 白色图形（跟随按钮文字色）· 全部自制无版权 · 点选后告诉我编号</p>
<div class="grid">

  <div class="card"><div class="icon"><svg viewBox="0 0 16 16" fill="#fff"><path d="M8 1 L9.8 6.2 L15.2 6.4 L10.9 9.7 L12.4 15 L8 11.6 L3.6 15 L5.1 9.7 L0.8 6.4 L6.2 6.2 Z"/></svg></div><div class="name">3. 五芒星</div><div class="desc">魔法星芒（实心）</div></div>

  <div class="card"><div class="icon"><svg viewBox="0 0 16 16" fill="none"><g stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 V5 M8 6 V8 M8 9 V11 M8 12 V14"/><path d="M8 5 C6.5 6 5.5 7 5.5 8.5 C5.5 9.8 6.4 10.6 8 11 C9.6 10.6 10.5 9.8 10.5 8.5 C10.5 7 9.5 6 8 5 Z"/><path d="M8 11 L6 14 M8 11 L10 14"/></g></svg></div><div class="name">7. 圣光</div><div class="desc">法杖光柱 + 光束</div></div>

</div>
</body>
</html>
